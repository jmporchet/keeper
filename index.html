<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keeper</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #f4e6c4;
        font-size: 18px;
        pointer-events: none;
      }
      #sandbox-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 10;
      }
      #sandbox-panel button {
        font: inherit;
        color: #f4e6c4;
        background: #3a2f26;
        border: 1px solid #6b5a45;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #sandbox-panel button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #sandbox-panel button[aria-pressed="true"] {
        background: #6b5a45;
      }
      #pause-overlay {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        color: #f4e6c4;
        font-size: 32px;
        background: rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      #pause-overlay.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="hud">gold 0 · imps 4 · tick 0</div>
    <div id="sandbox-panel">
      <button id="spawn-imp" type="button">Spawn imp</button>
      <button id="add-gold" type="button">Add 100 gold</button>
      <button id="paint-treasury" type="button" aria-pressed="false">Paint treasury</button>
      <button id="paint-lair" type="button" aria-pressed="false">Paint lair</button>
      <button id="save-game" type="button">Save</button>
      <button id="load-game" type="button">Load</button>
      <input id="load-file" type="file" accept="application/json" hidden />
    </div>
    <div id="pause-overlay">Pause</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
